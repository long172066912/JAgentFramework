server:
  port: 8080

jagent:
  workspace: "./workspace"
  model:
    api-keys:
      dashscope: ${DASHSCOPE_API_KEY}
  agents:
    translator:
      name: "翻译助手"
      sys-prompt: "你是一个翻译引擎。严格遵循以下规则：\n1. 如果用户输入英文，翻译为中文\n2. 如果用户输入中文，翻译为英文\n3. 只输出翻译结果，不要添加任何解释、问候或额外内容\n4. 不要回答用户的问题，只做翻译"
      model: "dashscope:qwen3.7-flash"
      max-iters: 3
      max-retries: 3
    summarizer:
      name: "摘要助手"
      sys-prompt: "你是一个文本摘要助手。请用简洁的语言概括用户输入的核心要点，不超过 100 字。"
      model: "dashscope:qwen3.7-flash"
      max-iters: 3
      max-retries: 3
    chat:
      name: "智能助手"
      sys-prompt: |-
        你是一个智能助手，可以使用「知识检索」工具查询知识库。
        
        回答要求：
        1. 简洁直接，不要啰嗦
        2. 用空行分段，用数字编号组织要点
        3. 禁止使用 Markdown 符号（#、*、**、`、-）
        4. 不知道就说不知道，不要编造
      model: "openai:qwen3.8-max-preview"
      max-iters: 3
      max-retries: 2
      session-enabled: true
      memory-enabled: true
      enable-search: false
      skill-priorities:
        knowledge_search: 0.9
    chat-web:
      name: "联网搜索助手"
      sys-prompt: |-
        你是一个智能助手，拥有丰富的知识储备。
        
        回答要求：
        1. 简洁直接，不要啰嗦
        2. 用空行分段，用数字编号组织要点
        3. 禁止使用 Markdown 符号（#、*、**、`、-）
        4. 在回答末尾附上参考来源（如果有）
      model: "openai:qwen3.8-max-preview"
      max-iters: 3
      max-retries: 2
      session-enabled: true
      memory-enabled: true
      enable-search: false
    tagger:
      name: "智能打标助手"
      sys-prompt: "你是一个专业的内容标签抽取引擎。你的任务是分析输入内容，抽取最能代表其语义的标签，并为每个标签确定层级。输出必须是 JSON 格式。"
      user-prompt-template: |
        请分析以下{contentType}内容，抽取语义标签。
        
        内容：
        {contentText}
        
        要求：
        1. 必须抽取恰好 {requiredTagCount} 个最能代表内容语义的标签
        2. 每个标签包含：name、category、level、confidence、desc、keywords
        3. 严格按以下 JSON 格式输出，不要添加任何其他内容：
        ```json
        {{
          "tags": [
            {{
              "name": "标签名称",
              "category": "类目（视觉风格/情感氛围/场景用途/材质工艺/颜色配色/主题元素）",
              "level": 1,
              "confidence": 0.95,
              "desc": "标签介绍",
              "keywords": ["关键词1", "关键词2", "关键词3"]
            }}
          ]
        }}
        ```
      model: "dashscope:qwen3.7-flash"
      max-iters: 3
      max-retries: 3
      skill-priorities:
        vector_search: 0.9
        vector_upsert: 0.7
        vector_get: 0.5
        category_level_infer: 0.8
  evaluation:
    enabled: true
    llm-judge-enabled: true
    llm-judge-model: "dashscope:qwen-plus"
    latency-threshold-ms: 10000
    optimization:
      llm-enabled: true
      confidence-threshold: 0.9  # 低于此分数时自动触发优化建议
    weights:
      intelligence: 0.3
      performance: 0.15
      reliability: 0.2
      safety: 0.2
      experience: 0.15

logging:
  level:
    com.jrl.ai.agent: INFO
    io.agentscope: INFO

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  metrics:
    tags:
      application: jagent-demo
