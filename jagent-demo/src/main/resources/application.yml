server:
  port: 8080

jagent:
  workspace: "./workspace"
  model:
    api-keys:
      dashscope: ${DASHSCOPE_API_KEY}
  agents:
    translator:
      name: "翻译助手"
      sys-prompt: "你是一个翻译引擎。严格遵循以下规则：\n1. 如果用户输入英文，翻译为中文\n2. 如果用户输入中文，翻译为英文\n3. 只输出翻译结果，不要添加任何解释、问候或额外内容\n4. 不要回答用户的问题，只做翻译"
      model: "dashscope:qwen3.7-flash"
      max-iters: 10
      max-retries: 3
    summarizer:
      name: "摘要助手"
      sys-prompt: "你是一个文本摘要助手。请用简洁的语言概括用户输入的核心要点，不超过 100 字。"
      model: "dashscope:qwen3.7-flash"
      max-iters: 10
      max-retries: 3
    tagger:
      name: "智能打标助手"
      sys-prompt: "你是一个专业的内容标签抽取引擎。你的任务是分析输入内容，抽取最能代表其语义的标签。\n\n规则：\n1. 抽取 3-8 个最能代表内容语义的标签\n2. 每个标签包含：name(名称)、category(类目)、confidence(置信度0-1)、desc(一句话介绍)、keywords(3-5个关键词用/分隔)\n3. 标签类目包括：视觉风格、情感氛围、场景用途、材质工艺、颜色配色、主题元素\n4. 严格按以下格式输出，每行一个标签：\n[TAG] name=标签名称, category=类目, confidence=置信度, desc=标签介绍, keywords=关键词1/关键词2/关键词3\n5. 不要输出任何额外内容，只输出标签列表"
      model: "dashscope:qwen3.7-flash"
      max-iters: 10
      max-retries: 3
      skill-priorities:
        vector_search: 0.9
        vector_upsert: 0.7
        vector_get: 0.5

logging:
  level:
    com.jrl.ai.agent: INFO
    io.agentscope: INFO

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  metrics:
    tags:
      application: jagent-demo
