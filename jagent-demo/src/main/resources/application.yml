server:
  port: 8080

jagent:
# 配置多节点信息共享
#  store:
#    type: redis
  workspace: "./workspace"
  model:
    api-keys:
      openai: "${OPENAI_API_KEY:}"
    base-urls:
      openai: https://token-plan.cn-beijing.maas.aliyuncs.com/compatible-mode/v1
  agents:
    translator:
      name: "翻译助手"
      description: "专门处理翻译任务，支持中英互译及多语言翻译"
      sys-prompt: "你是一个翻译引擎。严格遵循以下规则：\n1. 如果用户输入英文，翻译为中文\n2. 如果用户输入中文，翻译为英文\n3. 只输出翻译结果，不要添加任何解释、问候或额外内容\n4. 不要回答用户的问题，只做翻译"
      model: "openai:qwen3.8-max-preview"
      max-iters: 3
      max-retries: 3
    summarizer:
      name: "摘要助手"
      description: "专门处理文本摘要任务，概括核心要点"
      sys-prompt: "你是一个文本摘要助手。请用简洁的语言概括用户输入的核心要点，不超过 100 字。"
      model: "openai:qwen3.8-max-preview"
      max-iters: 3
      max-retries: 3
    chat:
      name: "智能助手"
      sys-prompt: |-
        你是一个智能助手，可以使用「知识检索」工具查询知识库，也可以调度子 Agent 完成专业任务。
        
        回答要求：
        1. 简洁直接，不要啰嗦
        2. 每个要点独占一行，用数字编号（1. 2. 3.）组织，编号后必须换行
        3. 不同段落之间用空行分隔
        4. 不知道就说不知道，不要编造
        5. 如果引用了外部信息，在回答末尾用「参考来源：」列出，格式为 [标题](URL)
      model: "openai:qwen3.8-max-preview"
      max-iters: 5
      max-retries: 2
      session-enabled: true
      session-group: "chat"
      memory-enabled: true
      enable-search: false
      skill-priorities:
        knowledge_search: 0.9
      subagents:
        - id: translator
          keywords: ["翻译", "translate", "英文", "中文", "英译中", "中译英"]
        - id: summarizer
          keywords: ["摘要", "总结", "概括", "summarize", "要点"]
        - id: chat-web
          keywords: ["联网搜索", "web_search"]
    chat-web:
      name: "联网搜索助手"
      sys-prompt: |-
        你是一个联网搜索助手，拥有丰富的知识储备。

        工作流程（严格遵守）：
        1. 收到用户问题后，调用一次「web_search」工具搜索相关信息
        2. 收到搜索结果后，立即基于搜索结果回答用户问题，不要再调用任何工具
        3. 如果搜索结果不理想，可以调整关键词再搜索一次，然后必须直接回答

        禁止行为：
        - 禁止连续调用搜索工具超过 2 次
        - 禁止仅凭自身知识直接回答，必须结合搜索结果

        回答要求：
        1. 简洁直接，不要啰嗦
        2. 每个要点独占一行，用数字编号（1. 2. 3.）组织，编号后必须换行
        3. 不同段落之间用空行分隔
        4. 在回答末尾必须附上参考来源，每个来源独占一行，格式为：
           参考来源：
           [文章标题](URL)
           [文章标题](URL)
      model: "openai:qwen3.8-max-preview"
      max-iters: 5
      max-retries: 2
      session-enabled: true
      session-group: "chat"
      memory-enabled: true
      enable-search: false
      skill-priorities:
        web_search: 1.0
    tagger:
      name: "智能打标助手"
      sys-prompt: "你是一个专业的内容标签抽取引擎。你的任务是分析输入内容，抽取最能代表其语义的标签，并为每个标签确定层级。输出必须是 JSON 格式。"
      user-prompt-template: |
        请分析以下{contentType}内容，抽取语义标签。
        
        内容：
        {contentText}
        
        要求：
        1. 必须抽取恰好 {requiredTagCount} 个最能代表内容语义的标签
        2. 每个标签包含：name、category、level、confidence、desc、keywords
        3. 严格按以下 JSON 格式输出，不要添加任何其他内容：
        ```json
        {{
          "tags": [
            {{
              "name": "标签名称",
              "category": "类目（视觉风格/情感氛围/场景用途/材质工艺/颜色配色/主题元素）",
              "level": 1,
              "confidence": 0.95,
              "desc": "标签介绍",
              "keywords": ["关键词1", "关键词2", "关键词3"]
            }}
          ]
        }}
        ```
      model: "openai:qwen3.8-max-preview"
      max-iters: 3
      max-retries: 3
      require-confirm-tools:
        - vector_upsert
        - vector_delete
      skill-priorities:
        vector_search: 0.9
        vector_upsert: 0.7
        vector_get: 0.5
        category_level_infer: 0.8
  evaluation:
    enabled: true
    llm-judge-enabled: true
    llm-judge-model: "openai:qwen3.8-max-preview"
    latency-threshold-ms: 10000
    optimization:
      llm-enabled: true
      confidence-threshold: 0.6  # 低于此分数时自动触发优化建议
    weights:
      intelligence: 0.3
      performance: 0.15
      reliability: 0.2
      safety: 0.2
      experience: 0.15

logging:
  level:
    com.jrl.ai.agent: INFO
    io.agentscope: INFO

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  metrics:
    tags:
      application: jagent-demo
