plugins {
    id 'org.springframework.boot' version '3.4.7'
    id 'io.spring.dependency-management' version '1.1.7'
}

description = 'JAgent Demo - Spring Boot + AgentScope 2.0 演示应用'

// Spring Boot 不需要发布 jar
bootJar {
    enabled = true
}
jar {
    enabled = false
}

dependencies {
    implementation project(':jagent-core')
    implementation project(':jagent-agentscope')
    implementation project(':jagent-store-redis')  // 或 ':jagent-store-mysql'

    // Spring Boot WebFlux（响应式 + SSE 流式输出）
    implementation 'org.springframework.boot:spring-boot-starter-webflux'

    // Spring Boot Actuator + Micrometer（监控指标暴露）
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'io.micrometer:micrometer-core'

    // AgentScope 模型提供商
    implementation 'io.agentscope:agentscope-extensions-model-dashscope:2.0.0'
    implementation 'io.agentscope:agentscope-extensions-model-openai:2.0.0'


    // 测试
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
}
