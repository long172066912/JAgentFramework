description = 'JAgent AgentScope 扩展 - 适配 AgentScope 2.0 框架 + Spring Boot 集成'

dependencies {
    api project(':jagent-core')

    // AgentScope 2.0 核心 + Harness
    api 'io.agentscope:agentscope-harness:2.0.0'

    // DashScope 模型扩展（编译期引用，运行时由使用方提供）
    compileOnly 'io.agentscope:agentscope-extensions-model-dashscope:2.0.0'

    // Micrometer 监控（编译期引用，运行时由使用方提供）
    compileOnly 'io.micrometer:micrometer-core:1.14.4'

    // OpenTelemetry SDK（链路追踪自动初始化 + 评测 span 捕获，编译期引用，运行时由使用方提供 SDK）
    compileOnly 'io.opentelemetry:opentelemetry-sdk:1.61.0'
    compileOnly 'io.opentelemetry:opentelemetry-exporter-logging:1.61.0'

    // Caffeine 本地缓存（任务上下文 TTL 管理）
    api 'com.github.ben-manes.caffeine:caffeine:3.1.8'

    // Spring Boot（适配层可选依赖，编译期引用）
    compileOnly 'org.springframework.boot:spring-boot-autoconfigure:3.4.7'
    compileOnly 'org.springframework.boot:spring-boot:3.4.7'
    compileOnly 'org.springframework:spring-context:6.2.8'
    compileOnly 'org.springframework:spring-beans:6.2.8'
    compileOnly 'org.springframework:spring-webflux:6.2.8'
    compileOnly 'io.projectreactor:reactor-core:3.7.7'
}
