plugins {
    id 'java-library'
    id 'maven-publish'
}

group = 'com.jrl.ai'
version = '0.1.0'

// GitHub Packages 发布仓库地址
ext.githubRepoUrl = "https://maven.pkg.github.com/${System.getenv('GITHUB_REPOSITORY') ?: 'long172066912/JAgentFramework'}"

subprojects {
    apply plugin: 'java-library'

    group = 'com.jrl.ai'
    version = rootProject.version

    java {
        sourceCompatibility = JavaVersion.VERSION_25
        targetCompatibility = JavaVersion.VERSION_25
    }

    javadoc {
        options.addBooleanOption('Xdoclint:none', true)
        failOnError = false
    }

    repositories {
        mavenCentral()
    }

    dependencies {
        // Logging
        implementation 'org.slf4j:slf4j-api:2.0.13'

        // Testing
        testImplementation 'org.junit.jupiter:junit-jupiter:5.10.3'
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    }

    tasks.named('test') {
        useJUnitPlatform()
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        options.compilerArgs.addAll(['-parameters'])
    }

    java {
        toolchain {
            languageVersion.set(JavaLanguageVersion.of(25))
        }
    }

    // jagent-demo 不参与 Maven 发布
    if (project.name != 'jagent-demo') {
        apply plugin: 'maven-publish'

        java {
            withSourcesJar()
            withJavadocJar()
        }

        publishing {
        publications {
            mavenJava(MavenPublication) {
                from components.java

                pom {
                    name = project.name
                    description = project.description ?: 'JAgentFramework - Java AI Agent Framework'
                    url = 'https://github.com/long172066912/JAgentFramework'

                    licenses {
                        license {
                            name = 'The Apache License, Version 2.0'
                            url = 'https://www.apache.org/licenses/LICENSE-2.0.txt'
                        }
                    }

                    developers {
                        developer {
                            id = 'jrl'
                            name = 'JRL'
                            email = 'jrl@example.com'
                        }
                    }

                    scm {
                        connection = 'scm:git:git://github.com/long172066912/JAgentFramework.git'
                        developerConnection = 'scm:git:ssh://github.com/long172066912/JAgentFramework.git'
                        url = 'https://github.com/long172066912/JAgentFramework'
                    }
                }
            }
        }

        repositories {
            maven {
                name = "GitHubPackages"
                url = rootProject.ext.githubRepoUrl
                credentials {
                    username = System.getenv('GITHUB_ACTOR') ?: project.findProperty('gpr.user')
                    password = System.getenv('GITHUB_TOKEN') ?: project.findProperty('gpr.token')
                }
            }
        }
    }
    } // end if not jagent-demo
}
