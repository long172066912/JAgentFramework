description = 'JAgent MySQL 分布式存储 - 基于 HikariCP 的 KVStore/MemoryStore/AgentStateStore 实现'

dependencies {
    api project(':jagent-core')
    api project(':jagent-agentscope')

    // HikariCP 连接池
    api 'com.zaxxer:HikariCP:5.1.0'

    // Jackson for JSON serialization
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.18.0'
}
